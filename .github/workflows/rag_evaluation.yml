name: RAG Evaluation & CI/CD Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rag-quality-gate:
    name: "RAG Quality Gate & Benchmark"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr

    - name: Install Application Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run RAG Quality Gate Unit Assertions (DeepEval Pattern)
      env:
        PYTHONPATH: .
      run: |
        python tests/test_rag_evaluation.py

    - name: Run Retrieval Architecture Ablation Benchmark
      env:
        PYTHONPATH: .
      run: |
        python evaluation/benchmark.py --mode fast

    - name: Publish Benchmark Report to GitHub Summary
      run: |
        echo "### 📊 RAG Architecture Evaluation Summary" >> $GITHUB_STEP_SUMMARY
        cat evaluation/benchmark_report.md >> $GITHUB_STEP_SUMMARY
